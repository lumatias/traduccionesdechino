<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Presupuesto · Estudio Lu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif:wght@600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#14213d; --red:#c0392b; --red-dark:#9e2b1f; --gold:#d4a84b; --paper:#faf7f2; --paper-2:#f1ebe1; --text:#1d2433; --muted:#5b6477; --line:#e3dccf; --ok:#1e7f4f; --wa:#25d366; --mp:#009ee3;
    --font-sans:"Noto Sans","Noto Sans SC",system-ui,sans-serif; --font-serif:"Noto Serif","Noto Serif SC",Georgia,serif; }
  html[lang^="zh"] { --font-sans:"Noto Sans SC","Noto Sans","PingFang SC",sans-serif; --font-serif:"Noto Serif SC","Noto Serif",serif; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--text); font-family:var(--font-sans); line-height:1.55; font-size:16px; }
  h1,h2,h3 { font-family:var(--font-serif); color:var(--ink); margin:0 0 .4em; line-height:1.2; }
  .wrap { width:min(720px, 100% - 32px); margin:0 auto; padding:24px 0 48px; }
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font-family:var(--font-serif); font-weight:700; font-size:1.15rem; white-space:nowrap; }
  .brand .seal { width:34px; height:34px; border-radius:8px; background:var(--red); color:#fff; display:grid; place-items:center; }
  .lang { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff; }
  .lang button { border:0; background:transparent; padding:6px 12px; font:inherit; font-size:.85rem; cursor:pointer; color:var(--muted); white-space:nowrap; }
  .lang button.active { background:var(--ink); color:#fff; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 10px 30px rgba(20,33,61,.08); overflow:hidden; }
  .head { background:var(--ink); color:#fff; padding:22px 24px; }
  .head .eyebrow { font-size:.72rem; letter-spacing:.12em; text-transform:uppercase; color:var(--gold); font-weight:700; }
  .head h1 { color:#fff; font-size:1.5rem; margin:6px 0 2px; }
  .head .meta { font-size:.88rem; opacity:.85; display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:8px; }
  .body { padding:22px 24px; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  th, td { text-align:left; padding:10px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; }
  td.num, th.num { text-align:right; white-space:nowrap; }
  tr.total td { border-bottom:0; border-top:2px solid var(--ink); font-weight:700; font-size:1.1rem; color:var(--ink); padding-top:14px; }
  tr.total td.num { font-family:var(--font-serif); font-size:1.5rem; }
  .sub { color:var(--muted); font-size:.85rem; }
  .grid { display:grid; gap:12px; margin:18px 0; }
  @media (min-width:600px) { .grid { grid-template-columns:1fr 1fr; } }
  .tile { background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .tile b { display:block; font-size:.75rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:4px; }
  .tile span { font-weight:600; color:var(--ink); }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:13px 20px; border-radius:999px; font-weight:600; text-decoration:none; border:0; cursor:pointer; font:inherit; font-weight:600; width:100%; }
  .btn-mp { background:var(--mp); color:#fff; }
  .btn-wa { background:var(--wa); color:#073b1c; }
  .btn-outline { background:transparent; color:var(--ink); border:1.5px solid var(--ink); }
  .btn svg { width:20px; height:20px; flex:none; }
  .actions { display:grid; gap:10px; margin-top:8px; }
  .pay { background:var(--paper-2); border-radius:12px; padding:16px 18px; margin:18px 0; }
  .pay h3 { font-size:1.05rem; }
  .pay .amount { font-family:var(--font-serif); font-size:1.6rem; color:var(--ink); }
  .alias { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; background:#fff; border:1px dashed var(--line); padding:8px 12px; border-radius:8px; display:inline-block; margin-top:6px; user-select:all; }
  ol.steps { padding-left:20px; margin:8px 0 0; }
  ol.steps li { margin-bottom:6px; }
  .notes { background:#fff8e6; border-left:3px solid var(--gold); padding:10px 14px; border-radius:6px; margin:16px 0; font-size:.92rem; white-space:pre-line; }
  .foot { padding:16px 24px; border-top:1px solid var(--line); font-size:.82rem; color:var(--muted); }
  .foot b { color:var(--ink); }
  .invalid { text-align:center; padding:40px 20px; }
  .expired { background:#fdecea; color:#8a1c12; border-radius:8px; padding:10px 14px; font-weight:600; margin-bottom:14px; }
  @media print { body { background:#fff; } .lang, .actions, .btn { display:none !important; } .card { box-shadow:none; border:1px solid #ccc; } .wrap { width:100%; padding:0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="https://estudiolu.com.ar/"><span class="seal">譯</span><span>Estudio Lu</span></a>
    <div class="lang" role="group" aria-label="Idioma / 语言"><button type="button" data-lang="es">ES</button><button type="button" data-lang="zh">中文</button></div>
  </div>
  <div class="card" id="card"></div>
</div>

<script>
const CONFIG = {
  whatsapp: '5491170590809',
  email: 'estudiolu@outlook.com',
  traductor: 'Matías Lu',
  matricula: '',            // ej. 'Mat. CTPCBA Tomo XX Folio XXX'
  direccion: 'Arcos 2215, Of. 304, Belgrano, CABA'
};
const T = {
  es: {
    eyebrow:'Presupuesto', for:'Preparado para', date:'Fecha', num:'N.º', valid:'Válido hasta',
    col1:'Detalle', col2:'Cant.', col3:'Unitario', col4:'Subtotal', fojas:'foja(s)',
    leg:{simple:'Legalización CTPCBA (trámite simple)', urgente:'Legalización CTPCBA (trámite urgente)'}, legQ:'documento(s)',
    urg:'Recargo por urgencia', total:'Total', incl:'Honorarios profesionales. Incluye traducción, firma y sello de traductor público.',
    tEntrega:'Entrega', tFormato:'Formato de entrega', fmt:{digital:'PDF con firma digital y legalización digital del CTPCBA (misma validez que la ológrafa)'},
    payT:'Para confirmar', payP:'Se abona una seña del {pct} % y el saldo contra entrega.', sena:'Seña', saldo:'Saldo contra entrega',
    mp:'Pagar la seña con Mercado Pago', alias:'O por transferencia al alias', aliasHint:'Enviame el comprobante por WhatsApp.',
    wa:'Confirmar por WhatsApp', waMsg:'Hola Matías, confirmo el presupuesto {n} por {total}. Te envío el comprobante de la seña y el documento.',
    print:'Guardar en PDF', stepsT:'Después de la seña', steps:['Me enviás el escaneo o la foto completa y legible del documento original (PDF o imagen). Con ese archivo ya se realiza la traducción: no hace falta traer el papel.','Traduzco, firmo y gestiono la legalización en el CTPCBA.','Te aviso cuando esté lista y te envío el PDF por WhatsApp o correo.'],
    notes:'Observaciones', expired:'Este presupuesto venció. Escribime y lo actualizo en el día.',
    invalidT:'Enlace no válido', invalidP:'El enlace del presupuesto está incompleto. Escribime por WhatsApp y te lo reenvío.',
    foot:'Traductor Público de idioma chino, matriculado en el Colegio de Traductores Públicos de la Ciudad de Buenos Aires.'
  },
  zh: {
    eyebrow:'报价单', for:'客户', date:'日期', num:'编号', valid:'有效期至',
    col1:'项目', col2:'数量', col3:'单价', col4:'小计', fojas:'页',
    leg:{simple:'CTPCBA 协会认证（普通）', urgente:'CTPCBA 协会认证（加急）'}, legQ:'份',
    urg:'加急费', total:'合计', incl:'专业服务费。包含翻译、公共翻译员签字及盖章。',
    tEntrega:'交付日期', tFormato:'交付形式', fmt:{digital:'电子签名并经 CTPCBA 电子认证（数字认证）的 PDF，与手写纸质认证效力相同'},
    payT:'确认方式', payP:'支付 {pct}% 定金，余款交付时付清。', sena:'定金', saldo:'交付时付清余款',
    mp:'通过 Mercado Pago 支付定金', alias:'或转账至别名（alias）', aliasHint:'请通过 WhatsApp 发送付款凭证。',
    wa:'通过 WhatsApp 确认', waMsg:'您好 Matías，我确认报价单 {n}，金额 {total}。我将发送定金凭证和文件。',
    print:'保存为 PDF', stepsT:'支付定金后', steps:['请发送原件完整、清晰的扫描件或照片（PDF 或图片）。凭此即可完成翻译，无需送交纸质原件。','我进行翻译、签字，并到 CTPCBA 办理认证。','完成后通知您，通过 WhatsApp 或邮件发送 PDF。'],
    notes:'备注', expired:'此报价单已过期。请联系我，当天更新。',
    invalidT:'链接无效', invalidP:'报价链接不完整。请通过 WhatsApp 联系我，我会重新发送。',
    foot:'中文公共翻译员，布宜诺斯艾利斯市公共翻译员协会（CTPCBA）注册。'
  }
};
const dec = s => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const money = n => '$ ' + Math.round(n).toLocaleString('es-AR');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pdate(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? new Date(+m[1], m[2]-1, +m[3]) : null; }
function fdate(s, l) { const d = pdate(s); return d ? d.toLocaleDateString(l === 'zh' ? 'zh-CN' : 'es-AR', { day:'numeric', month:'long', year:'numeric' }) : (s || '—'); }
const waUrl = msg => 'https://wa.me/' + CONFIG.whatsapp + '?text=' + encodeURIComponent(msg);

let data = null, lang = 'es';
try { const h = location.hash.slice(1); if (h) data = dec(h); } catch (e) { data = null; }

function render() {
  const t = T[lang];
  document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : 'es-AR';
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  const card = document.getElementById('card');
  if (!data || !Array.isArray(data.it)) {
    card.innerHTML = `<div class="invalid"><h2>${t.invalidT}</h2><p>${t.invalidP}</p><a class="btn btn-wa" style="max-width:320px" href="${waUrl('Hola, el enlace del presupuesto no abre.')}">WhatsApp</a></div>`;
    return;
  }
  const d = data;
  let sub = 0;
  const rows = d.it.map(i => { const st = i.q * i.u; sub += st; return `<tr><td>${esc(i.d)}</td><td class="num">${i.q} ${t.fojas}</td><td class="num">${money(i.u)}</td><td class="num">${money(st)}</td></tr>`; });
  let urgAmt = 0;
  if (d.up > 0) { urgAmt = sub * d.up / 100; rows.push(`<tr><td>${t.urg} (${d.up} %)</td><td></td><td></td><td class="num">${money(urgAmt)}</td></tr>`); }
  let legAmt = 0;
  if (d.lg && d.lg.t !== 'none' && d.lg.q > 0) { legAmt = d.lg.q * d.lg.u; rows.push(`<tr><td>${t.leg[d.lg.t] || t.leg.simple}</td><td class="num">${d.lg.q} ${t.legQ}</td><td class="num">${money(d.lg.u)}</td><td class="num">${money(legAmt)}</td></tr>`); }
  const total = d.tot ?? (sub + urgAmt + legAmt);
  const senaPct = d.sp ?? 50, sena = Math.round(total * senaPct / 100 / 100) * 100;
  const today = new Date(); today.setHours(0,0,0,0);
  const vd = pdate(d.val); const expired = vd && vd < today;
  const waMsg = t.waMsg.replace('{n}', d.n || '').replace('{total}', money(total));
  const notes = d.nt ? (lang === 'zh' && d.ntz ? d.ntz : d.nt) : '';
  document.title = `${t.eyebrow} ${d.n || ''} · Estudio Lu`;

  card.innerHTML = `
    <div class="head">
      <div class="eyebrow">${t.eyebrow} · Traducción pública de chino</div>
      <h1>${t.for} ${esc(d.c || '')}</h1>
      <div class="meta"><span>${t.num} ${esc(d.n || '')}</span><span>${t.date}: ${fdate(d.f, lang)}</span><span>${t.valid}: ${fdate(d.val, lang)}</span></div>
    </div>
    <div class="body">
      ${expired ? `<div class="expired">${t.expired}</div>` : ''}
      <table>
        <thead><tr><th>${t.col1}</th><th class="num">${t.col2}</th><th class="num">${t.col3}</th><th class="num">${t.col4}</th></tr></thead>
        <tbody>${rows.join('')}
        <tr class="total"><td colspan="3">${t.total}</td><td class="num">${money(total)}</td></tr></tbody>
      </table>
      <p class="sub">${t.incl}</p>
      <div class="grid">
        <div class="tile"><b>${t.tEntrega}</b><span>${fdate(d.ent, lang)}</span></div>
        <div class="tile"><b>${t.tFormato}</b><span>${t.fmt[d.dt] || t.fmt.digital}</span></div>
      </div>
      ${notes ? `<div><b>${t.notes}</b><div class="notes">${esc(notes)}</div></div>` : ''}
      <div class="pay">
        <h3>${t.payT}</h3>
        <p>${t.payP.replace('{pct}', senaPct)}</p>
        <div class="grid" style="margin:10px 0">
          <div class="tile"><b>${t.sena}</b><span class="amount">${money(sena)}</span></div>
          <div class="tile"><b>${t.saldo}</b><span>${money(total - sena)}</span></div>
        </div>
        <div class="actions">
          ${d.mp ? `<a class="btn btn-mp" href="${esc(d.mp)}" target="_blank" rel="noopener">${t.mp}</a>` : ''}
          ${d.al ? `<div>${t.alias}: <span class="alias">${esc(d.al)}</span><div class="sub">${t.aliasHint}</div></div>` : ''}
          <a class="btn btn-wa" href="${waUrl(waMsg)}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11.8 11.8 0 0 0 12.1 0C5.5 0 .2 5.3.2 11.9c0 2.1.5 4.1 1.6 5.9L0 24l6.4-1.7a11.9 11.9 0 0 0 5.7 1.5c6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.5-8.4z"/></svg>${t.wa}</a>
          <button class="btn btn-outline" type="button" onclick="window.print()">${t.print}</button>
        </div>
      </div>
      <h3 style="font-size:1.05rem">${t.stepsT}</h3>
      <ol class="steps">${t.steps.map(s => `<li>${s}</li>`).join('')}</ol>
    </div>
    <div class="foot"><b>${esc(CONFIG.traductor)}</b> · ${t.foot}${CONFIG.matricula ? ' ' + esc(CONFIG.matricula) + '.' : ''}<br>${esc(CONFIG.direccion)} · +54 11 7059 0809 · ${CONFIG.email}</div>`;
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; render(); }));
lang = (data && data.l === 'zh') ? 'zh' : 'es';
render();
</script>
</body>
</html>
